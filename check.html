<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Winning Certificate</title>
  <!-- html2pdf library for seamless mobile PDF generation -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <style>
    /* Print aur PDF ke liye Page Setup */
    @page {
      size: A4 landscape;
      margin: 0;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background-color: #f0f2f5;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    /* Certificate Main Container */
    .certificate-container {
      width: 100%;
      max-width: 1056px; /* A4 Landscape standard ratio width */
      height: 745px;  /* A4 Landscape standard ratio height */
      background: linear-gradient(135deg, #fffdfa 0%, #f4ebd0 100%);
      border: 10px solid #d4af37;
      padding: 40px;
      text-align: center;
      position: relative;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .cert-header h1 {
      color: #b8860b;
      font-size: 42px;
      margin: 0;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .cert-header p {
      color: #555;
      font-size: 18px;
      margin-top: 5px;
    }

    .cert-body {
      margin: 20px 0;
    }

    .cert-body h2 {
      font-size: 24px;
      color: #333;
      margin-bottom: 10px;
    }

    .winner-name {
      font-size: 38px;
      color: #1a1a1a;
      border-bottom: 2px solid #d4af37;
      display: inline-block;
      padding: 0 30px;
      margin: 10px 0;
      font-weight: bold;
    }

    .cert-body p {
      font-size: 16px;
      color: #666;
      line-height: 1.5;
    }

    .cert-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 30px;
      padding: 0 40px;
    }

    .signature-box {
      text-align: center;
      border-top: 1px solid #333;
      width: 200px;
      padding-top: 5px;
      font-weight: bold;
      color: #333;
    }

    /* Download Button Styling */
    .download-btn {
      margin-top: 25px;
      background-color: #28a745;
      color: white;
      border: none;
      padding: 12px 25px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      border-radius: 5px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }

    .download-btn:hover {
      background-color: #218838;
    }

    /* Mobile responsive media query */
    @media screen and (max-width: 1100px) {
      .certificate-container {
        width: 100%;
        height: auto;
        aspect-ratio: 1.414 / 1;
        padding: 20px;
      }
      .cert-header h1 { font-size: 28px; }
      .winner-name { font-size: 24px; }
      .cert-body p { font-size: 14px; }
    }
  </style>
</head>
<body>

  <!-- Certificate Box -->
  <div id="certificate" class="certificate-container">
    <div class="cert-header">
      <h1>Certificate of Winning</h1>
      <p>This is proudly presented to</p>
    </div>
    
    <div class="cert-body">
      <div class="winner-name">Kundan Kumar</div>
      <p>For outstanding performance and securing winning status in the official portal event.</p>
    </div>

    <div class="cert-footer">
      <div class="signature-box">Authorized Signatory</div>
      <div class="signature-box">Date</div>
    </div>
  </div>

  <!-- Download Button -->
  <button class="download-btn" onclick="downloadPDF()">Download Certificate (PDF)</button>

  <script>
    function downloadPDF() {
      const element = document.getElementById('certificate');
      
      const options = {
        margin:       0,
        filename:     'winning-certificate.pdf',
        image:        { type: 'jpeg', quality: 0.98 },
        html2canvas:  { scale: 2, useCORS: true, logging: false },
        jsPDF:        { unit: 'mm', format: 'a4', orientation: 'landscape' }
      };

      // Generate and download PDF instantly for mobile & desktop
      html2pdf().from(element).set(options).save();
    }
  </script>

</body>
</html>
